# The fixture indexer Job CI runs (section 6). Same image, service account and
# security context as k8s/base/indexer-job.yaml; the only differences are the
# corpus volume and the failure behaviour:
#
# * /corpus is a ConfigMap of the three fixture documents, created in the
#   workflow with `kubectl create configmap rahbar-fixtures --from-file=...`
#   (git never carries a mounted file set, so it is built at deploy time),
# * backoffLimit 0 + restartPolicy Never: a failed run stays failed and keeps
#   its logs, so the workflow can dump them instead of silently retrying.
apiVersion: batch/v1
kind: Job
metadata:
  name: fixture-indexer
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
    spec:
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      containers:
        - name: indexer
          image: rahbar-indexer:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: rahbar-config
            - secretRef:
                name: rahbar-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: corpus
          configMap:
            name: rahbar-fixtures
        - name: tmp
          emptyDir: {}
