name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy api/app indexer/pipeline --ignore-missing-imports

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
          pip install -r indexer/requirements.txt -r indexer/requirements-dev.txt

      - name: Run unit tests with pytest & coverage
        run: |
          pytest api/tests indexer/tests --cov=api/app --cov=indexer/pipeline --cov-report=term-missing --cov-fail-under=60

  manifests:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Kustomize and Kubeconform
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas

  build:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: api
          push: false
          tags: rahbar-api:${{ github.sha }}

      - name: Build Indexer image
        uses: docker/build-push-action@v5
        with:
          context: indexer
          push: false
          tags: rahbar-indexer:${{ github.sha }}

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ui
          push: false
          tags: rahbar-ui:${{ github.sha }}

  scan:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build API image for scan
        uses: docker/build-push-action@v5
        with:
          context: api
          load: true
          tags: rahbar-api:${{ github.sha }}

      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "rahbar-api:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  e2e-eval:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-rahbar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install eval dependencies
        run: |
          pip install -r api/requirements.txt pyyaml httpx

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="test-key" --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for core dependencies
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=120s || true
          kubectl rollout status deployment/redis -n rahbar --timeout=120s || true

      - name: Run Indexer Job on fixtures
        run: |
          kubectl create job --from=cronjob/reindex fixture-indexer -n rahbar || kubectl apply -f k8s/base/indexer-job.yaml
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s || true

      - name: Verify API rollout
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s || true

      - name: Run evaluation gate
        run: |
          python eval/run_eval.py --ci || true
