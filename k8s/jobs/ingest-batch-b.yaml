# A2 first Batch B ingest: verify, quarantine bad docs, embed the rest.
apiVersion: batch/v1
kind: Job
metadata:
  name: a3-ingest-batch-b
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/component: a3-ingest
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
    spec:
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      containers:
        - name: indexer
          image: rahbar-indexer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CORPUS_DIR
              value: /corpus/batch_b
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: rahbar-config
            - secretRef:
                name: rahbar-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 3Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: rahbar-data
