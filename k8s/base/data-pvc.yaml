apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rahbar-data
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
# Holds /data/lake (active source bytes), /data/quarantine, /data/archive,
# /data/verify (one report per ingestion run), /data/state.json and
# /data/traces/trace.jsonl. The Chroma vectors have their own PVC.
