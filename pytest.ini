# Run the whole suite from the repository root:
#     pytest api/tests indexer/tests --cov=api/app --cov=indexer/pipeline
# `pythonpath` puts both packages on sys.path, so one invocation can collect
# api/tests and indexer/tests together (CI and the coverage gate rely on that).
# `cd api && pytest` still picks up api/pyproject.toml, which is found first.
[pytest]
pythonpath = api indexer
testpaths = api/tests indexer/tests
filterwarnings =
    ignore::DeprecationWarning:starlette.*
