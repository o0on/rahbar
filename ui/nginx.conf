# nginx for the ui Deployment. Replaces /etc/nginx/nginx.conf in your image.
#
# Built to run as a non-root user with readOnlyRootFilesystem: true (section 4.7).
# - It listens on 8080, because a non-root process cannot bind ports below 1024.
# - Everything nginx writes (pid, temp files) goes under /tmp, so mount an
#   emptyDir volume at /tmp in your Deployment.
# - Logs go to stdout and stderr (section 4.8).
#
# The API is NOT proxied here: your Ingress routes /api to the api Service.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        resolver 10.96.0.10 valid=10s ipv6=off;

        # For the ui container's own probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            set $api_upstream http://api.rahbar.svc.cluster.local:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
